fullnameOverride: "external-secrets"
namespace: "external-secret"

installCRDS: true

replicaCount: 2

# image:
#   repository: ghcr.io/external-secrets/external-secrets
#   tag: v0.9.0
#   pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: "external-secrets"
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

podSecurityContext:
  fsGroup: 1000

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

