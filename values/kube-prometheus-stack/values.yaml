nameOverride: ""
fullnameOverride: ""

prometheus:
  enabled: true
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m
        
    retention: 10d
    retentionSize: "9GiB"
    
    podMonitorSelector: {}
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
  additionalServiceMonitors:
  - name: "myapp-task2"
    selector:
      matchLabels:
        metrics: "true"
    namespaceSelector:
      any: true
    endpoints:
      - port: "http"
        interval: 30s
        path: /metrics

alertmanager:
  config:
    global:
      resolve_timeout: 5m
      
    route:
      receiver: 'telegram'
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h

    receivers:
    - name: 'telegram'
      webhook_configs:
      - url: 'https://api.telegram.org/bot8267216338:AAFLL7IWr8J-v8pKtKNeASkm92sJWj3q-2Y/sendMessage?chat_id=-5005806102&parse_mode=HTML&text={{ range .Alerts }}{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }}%20<b>{{ .Status | toUpper }}</b>%0A%0A🔥%20<b>{{ .Annotations.summary }}</b>%0A📝%20{{ .Annotations.description }}%0A%0A📌%20<b>Alert:</b>%20{{ .Labels.alertname }}%0A📍%20<b>Instance:</b>%20{{ .Labels.instance }}%0A📦%20<b>Namespace:</b>%20{{ .Labels.namespace }}%0A🕒%20<b>Time:</b>%20{{ .StartsAt.Format "15:04:05" }}{{ end }}'
        send_resolved: true
        max_alerts: 5      

grafana:
  enabled: true
  adminPassword: "admin"
  persistence:
    enabled: true
    size: 5Gi
    accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.logs.svc.cluster.local:3100

prometheusOperator:
  enabled: true
  crds:
    enabled: false
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

nodeExporter:
  enabled: true

kube-state-metrics:
  enabled: true

serviceAccounts:
  create: true
  automount: true