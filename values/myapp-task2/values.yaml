replicaCountBackend: 2
replicaCountFrontend: 1
frontend:
  image:
    repository: piktakatya/my-frontend
    tag: efc647f18155f188b8d56e681ff63c35e168181e
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  pdb:
    enabled: true
    minAvailable: 50%
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
backend:
  image:
    repository: piktakatya/my-backend
    tag: 9273a56cf4f098f618d11872f0d002e4848df3ce
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m
  pdb:
    enabled: true
    minAvailable: 50%
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
mysql:
  image:
    repository: mysql
    tag: 8.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3306
    targetPort: 3306
  resources:
    requests:
      memory: 512Mi
      cpu: 300m
    limits:
      memory: 1Gi
      cpu: 500m
  persistence:
    enabled: true
    storageClass: do-block-storage
    accessMode: ReadWriteMany
    size: 8Gi
redis:
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  persistence:
    enabled: true
    storageClass: do-block-storage
    accessMode: ReadWriteMany
    size: 1Gi
ingress:
  enabled: true
  host: task2.local
configMap:
  enabled: true
  data:
    MYSQL_USER: root
    MYSQL_DB: tasks_db
    REDIS_PORT: '6379'
    FLASK_ENV: development
    API_URL: ''
pdb:
  enabled: true
  minAvailable: 50%
  maxUnavailable: 1
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
