apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces-chart
spec:
  project: default
  source:
    repoURL: https://github.com/KatyaPikta/infra-argo.git
    targetRevision: HEAD
    path: charts/namespaces-chart
    helm:
      skipCrds: true
      valueFiles:
        - "../../values/namespaces-chart/values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true