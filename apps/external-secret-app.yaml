apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
spec:
  project: default
  source:
    repoURL: https://github.com/KatyaPikta/infra-argo.git
    targetRevision: HEAD
    path: ../charts/external-secrets
    helm:
      valueFiles:
        - ../values/external-secrets/values.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secret
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
