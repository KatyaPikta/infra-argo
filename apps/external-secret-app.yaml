apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: external-secret
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    path: charts/external-secrets
    repoURL: https://github.com/KatyaPikta/infra-argo.git
    targetRevision: HEAD
    
    helm:
      valueFiles:
        - values/external-secrets/values.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secret
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
      
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
        
