apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-backup-schedules
  namespace: argocd
spec:
  project: default
  source:
    path: apps/velero-backup-schedules/schedules
    repoURL: https://github.com/KatyaPikta/infra-argo.git
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true