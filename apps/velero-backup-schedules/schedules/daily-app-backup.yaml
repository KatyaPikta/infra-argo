apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-myapp-backup
  namespace: backup
spec:
  schedule: "44 19 * * *"
  template:
    includedNamespaces:
    - myapp-task2
    includedResources:
      - "*"
    snapshotVolumes: true
    defaultVolumesToFsBackup: false
    ttl: 720h
    storageLocation: default
    volumeSnapshotLocations:
    - default