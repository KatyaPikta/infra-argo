apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-myapp-backup
  namespace: backup
spec:
  schedule: "44 20 * * *"
  template:
    includedNamespaces:
    - myapp-task2
    snapshotVolumes: true
    defaultVolumesToFsBackup: false
    ttl: 720h  # 30 дней
    storageLocation: default
    volumeSnapshotLocations:
    - default