---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend-active
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    component: backend
    metrics: "true"
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-backend
    version: stable