apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.replicaCountFrontend }}
  revisionHistoryLimit: 2
  
  strategy:
    blueGreen:
      activeService: rollout-frontend-active
      previewService: rollout-frontend-preview
      
      autoPromotionEnabled: false
      autoPromotionSeconds: 3000
      
      scaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app: rollout-frontend
  template:
    metadata:
      labels:
        app: rollout-frontend
        {{- include "my-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: rollout-frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 80
        env:
        - name: FE_HOST
          value: rollout-frontend
        - name: API_URL
          valueFrom: 
            configMapKeyRef:
              name: rollout-configmap
              key: API_URL
        livenessProbe:
          httpGet:
            path: index.html
            port: 80
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
