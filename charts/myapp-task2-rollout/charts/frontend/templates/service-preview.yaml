---
apiVersion: v1
kind: Service
metadata:
  name: rollout-frontend-preview
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    component: frontend
    metrics: "true"
    app: rollout-frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  selector:
    app: rollout-frontend
