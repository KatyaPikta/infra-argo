apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rollout-redis
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rollout-redis
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  podManagementPolicy: OrderedReady
  template:
    metadata:
      labels:
        app: rollout-redis
        {{- include "my-app.selectorLabels" . | nindent 8 }}
      annotations:
        backup.velero.io/backup-volumes: redis-data
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: rollout-redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        command: ["redis-server", "--appendonly", "yes"]
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          {{- toYaml .Values.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources:
         requests:
           storage: {{ .Values.redis.persistence.size | default "10Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-redis
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    component: cache
    metrics: "true"
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.service.targetPort }}
      protocol: TCP
  selector:
    app: rollout-redis