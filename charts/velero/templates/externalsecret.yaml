apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-credentials
    creationPolicy: Owner
  data:
    - secretKey: cloud
      remoteRef:
        key: secret/velero/credentials
        property: cloud