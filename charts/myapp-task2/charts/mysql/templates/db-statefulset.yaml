apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mysql
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    component: database
    metrics: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mysql
        {{- include "my-app.selectorLabels" . | nindent 8 }}
      annotations:
        backup.velero.io/backup-volumes: db-data
        pre.hook.backup.velero.io/command: '["/bin/bash", "-c", "mysql -u$MYSQL_USER -p$MYSQL_PASSWORD -e \"FLUSH TABLES WITH READ LOCK; SELECT SLEEP(5);\" &"]'
        pre.hook.backup.velero.io/container: mysql
        post.hook.backup.velero.io/command: '["/bin/bash", "-c", "mysql -u$MYSQL_USER -p$MYSQL_PASSWORD -e \"UNLOCK TABLES;\" &"]'
        post.hook.backup.velero.io/container: mysql
    spec:
      containers:
      - name: {{ .Release.Name }}-mysql
        image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
        imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
        ports:
        - containerPort: 3306
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MYSQL_DATABASE
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MYSQL_PASSWORD
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 20
          failureThreshold: 10
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 20
        resources:
          {{- toYaml .Values.mysql.resources | nindent 12 }}
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysql
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    component: database
spec:
  type: {{ .Values.mysql.service.type }}
  ports:
    - port: {{ .Values.mysql.service.port }}
      targetPort: {{ .Values.mysql.service.targetPort }}
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-mysql