apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.replicaCountFrontend }}
  revisionHistoryLimit: 2
  strategy:
    blueGreen:
      activeService: {{ .Release.Name }}-frontend-active
      previewService: {{ .Release.Name }}-frontend-preview
      
      autoPromotionEnabled: false
      autoPromotionSeconds: 30
      
      # prePromotionAnalysis:
      #   templates:
      #   - templateName: smoke-tests
      
      scaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
      version: stable
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
        {{- include "my-app.selectorLabels" . | nindent 8 }}
        version: stable
    spec:
      containers:
      - name: {{ .Release.Name }}-frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 80
        env:
        - name: FE_HOST
          value: {{ .Release.Name }}-frontend
        - name: API_URL
          valueFrom: 
            configMapKeyRef:
              name: {{ .Release.Name }}-configmap
              key: API_URL
        livenessProbe:
          httpGet:
            path: index.html
            port: 80
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend-active
  labels:
      {{- include "my-app.labels" . | nindent 4 }}
    component: frontend
    metrics: "true"
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-frontend

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend-preview
  labels:
      {{- include "my-app.labels" . | nindent 4 }}
    component: frontend
    metrics: "true"
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-frontend