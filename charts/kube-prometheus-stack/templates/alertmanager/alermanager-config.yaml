apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-telegram-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      http_config:
        follow_redirects: true
        enable_http2: true
      smtp_hello: localhost
      smtp_require_tls: true
      smtp_tls_config:
        insecure_skip_verify: false
      pagerduty_url: https://events.pagerduty.com/v2/enqueue
      opsgenie_api_url: https://api.opsgenie.com/
      wechat_api_url: https://qyapi.weixin.qq.com/cgi-bin/
      victorops_api_url: https://alert.victorops.com/integrations/generic/20131114/alert/
      telegram_api_url: https://api.telegram.org
      webex_api_url: https://webexapis.com/v1/messages
      rocketchat_api_url: https://open.rocket.chat/
    
    route:
      receiver: 'telegram-alerts'
      group_by: ['alertname', 'cluster']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      
      routes:
      - receiver: 'telegram-critical'
        matchers:
        - severity="critical"
        repeat_interval: 5m
        continue: true
      
      - receiver: 'telegram-warning'
        matchers:
        - severity="warning"
        continue: true
    
    inhibit_rules:
    - source_matchers:
      - severity="critical"
      target_matchers:
      - severity=~"warning|info"
      equal:
      - namespace
      - alertname
    - source_matchers:
      - severity="warning"
      target_matchers:
      - severity="info"
      equal:
      - namespace
      - alertname
    
    receivers:
    - name: 'telegram-alerts'
      webhook_configs:
      - url: 'https://api.telegram.org/bot8267216338:AAFLL7IWr8J-v8pKtKNeASkm92sJWj3q-2Y/sendMessage'
        send_resolved: true
        http_config:
          headers:
            Content-Type: application/json
          body: |
            {
              "chat_id": "-5005806102",
              "text": "🚨 *Alert:* {{ .GroupLabels.alertname }}\n\n{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}",
              "parse_mode": "Markdown",
              "disable_notification": true
            }
    
    - name: 'telegram-critical'
      webhook_configs:
      - url: 'https://api.telegram.org/bot8267216338:AAFLL7IWr8J-v8pKtKNeASkm92sJWj3q-2Y/sendMessage'
        send_resolved: true
        http_config:
          body: |
            {
              "chat_id": "-5005806102",
              "text": "🔥 *CRITICAL ALERT*\n\n{{ range .Alerts }}{{ .Annotations.summary }}\nInstance: {{ .Labels.instance }}\nNamespace: {{ .Labels.namespace }}{{ end }}",
              "parse_mode": "Markdown",
              "disable_notification": false
            }
    
    - name: 'telegram-warning'
      webhook_configs:
      - url: 'https://api.telegram.org/bot8267216338:AAFLL7IWr8J-v8pKtKNeASkm92sJWj3q-2Y/sendMessage'
        send_resolved: true
        http_config:
          body: |
            {
              "chat_id": "-5005806102",
              "text": "⚠️ *WARNING*\n{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}",
              "parse_mode": "Markdown",
              "disable_notification": true
            }
    
    templates:
    - /etc/alertmanager/config/*.tmpl